<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRTFC Academy IDP Generator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green:       #2A8C3F;
  --green-dark:  #1a5c28;
  --green-deep:  #0f3d1a;
  --green-light: #e8f5ec;
  --gold:        #B8922A;
  --gold-light:  #faf0dc;
  --red:         #C0272D;
  --red-light:   #fdecea;
  --blue:        #185fa5;
  --amber:       #ef9f27;
  --text:        #111110;
  --text2:       #52514e;
  --text3:       #98978f;
  --bg:          #f5f5f3;
  --surface:     #ffffff;
  --border:      rgba(0,0,0,0.08);
  --border2:     rgba(0,0,0,0.14);
  --r-sm:        8px;
  --r-md:        12px;
  --r-lg:        16px;
  --r-full:      999px;
  --shadow:      0 1px 3px rgba(0,0,0,0.06);
  --shadow-md:   0 4px 12px rgba(0,0,0,0.10);
  --shadow-lg:   0 12px 32px rgba(0,0,0,0.14);
}
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* HEADER */
.page-header { background: var(--green-deep); color: #fff; padding: 14px 1.5rem; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
.page-header img { width: 32px; height: 32px; object-fit: contain; }
.page-header-title { font-size: 15px; font-weight: 700; }
.page-header-sub { font-size: 12px; opacity: 0.65; }
.back-btn { margin-left: auto; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22); color: #fff; padding: 6px 14px; border-radius: var(--r-full); font-size: 12px; cursor: pointer; text-decoration: none; }

/* CONTROLS */
.controls { max-width: 860px; margin: 1.5rem auto; padding: 0 1rem; }
.controls-card { background: var(--surface); border-radius: var(--r-lg); padding: 1.25rem; box-shadow: var(--shadow); margin-bottom: 1rem; border: 1px solid var(--border); }
.controls-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 1rem; }
.form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.form-row > * { flex: 1; min-width: 130px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
label { font-size: 13px; font-weight: 500; color: var(--text2); }
select, input { padding: 10px 12px; font-size: 14px; border: 1.5px solid var(--border2); border-radius: var(--r-sm); background: var(--bg); color: var(--text); width: 100%; font-family: inherit; }
select:focus, input:focus { outline: none; border-color: var(--green); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.btn-primary { background: var(--green); color: #fff; border: none; padding: 11px 22px; border-radius: var(--r-md); font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-primary:hover { background: var(--green-dark); }
.btn-secondary { background: transparent; border: 1.5px solid var(--border2); color: var(--text); padding: 11px 20px; border-radius: var(--r-md); font-size: 14px; cursor: pointer; }
.btn-secondary:hover { background: var(--bg); }
.btn-amber { background: var(--amber); color: #fff; border: none; padding: 11px 22px; border-radius: var(--r-md); font-size: 14px; font-weight: 600; cursor: pointer; }
.status-msg { font-size: 13px; margin-top: 10px; color: var(--green); min-height: 18px; }

/* BULK SECTION */
.bulk-section { background: var(--surface); border-radius: var(--r-lg); padding: 1.25rem; box-shadow: var(--shadow); margin-bottom: 1rem; border: 1px solid var(--border); }
.bulk-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 1rem; }
.bulk-player-list { display: flex; flex-direction: column; gap: 6px; margin-top: 1rem; }
.bulk-player-row { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 14px; display: flex; align-items: center; gap: 12px; font-size: 14px; }
.bulk-player-name { flex: 1; font-weight: 600; }
.bulk-player-meta { font-size: 12px; color: var(--text2); }
.bulk-player-email { font-size: 12px; color: var(--text3); }
.bulk-btn-row { display: flex; gap: 6px; }

/* IDP PREVIEW */
.idp-preview { max-width: 860px; margin: 0 auto 3rem; padding: 0 1rem; }
.idp-doc { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); margin-bottom: 2rem; overflow: hidden; border: 1px solid var(--border); }

/* IDP HEADER */
.idp-header-band { background: linear-gradient(135deg, var(--green-deep) 0%, var(--green-dark) 100%); color: #fff; padding: 2rem 2rem 1.75rem; }
.idp-crest-row { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
.idp-crest { width: 58px; height: 58px; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3)); flex-shrink: 0; }
.idp-club-name { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,0.55); margin-bottom: 5px; }
.idp-doc-title { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; }
.idp-player-name { font-size: 17px; font-weight: 600; color: rgba(255,255,255,0.88); }
.idp-meta-row { display: flex; gap: 18px; flex-wrap: wrap; }
.idp-meta-item strong { font-weight: 700; color: #fff; display: block; font-size: 14px; }
.idp-meta-item span { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.5); }

/* IDP BODY */
.idp-body { padding: 1.5rem 2rem 2rem; }
.idp-section { margin-bottom: 2rem; }
.idp-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--green); margin-bottom: 1rem; padding-bottom: 6px; border-bottom: 2px solid var(--green-light); }
.idp-metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px,1fr)); gap: 8px; margin-bottom: 1rem; }
.idp-metric { background: var(--bg); border-radius: var(--r-md); padding: 12px; text-align: center; }
.idp-metric-val { font-size: 24px; font-weight: 800; color: var(--green-dark); line-height: 1; }
.idp-metric-lbl { font-size: 11px; color: var(--text2); margin-top: 3px; font-weight: 500; }
.idp-bar-row { margin-bottom: 10px; }
.idp-bar-labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--text2); margin-bottom: 4px; }
.idp-bar-track { height: 8px; background: #ebebea; border-radius: var(--r-full); overflow: hidden; }
.idp-bar-fill { height: 100%; border-radius: var(--r-full); }
.idp-comments-block { background: var(--bg); border-left: 3px solid var(--green); border-radius: 0 var(--r-sm) var(--r-sm) 0; padding: 10px 12px; font-size: 13px; line-height: 1.65; margin-top: 6px; }
.idp-alert { background: var(--red-light); border-left: 4px solid var(--red); border-radius: 0 var(--r-sm) var(--r-sm) 0; padding: 10px 14px; font-size: 13px; color: var(--red); margin-top: 10px; }

/* GOALS */
.idp-goal-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: var(--bg); border-radius: var(--r-md); border: 1px solid var(--border); margin-bottom: 8px; }
.idp-goal-checkbox { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--green); flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; }
.idp-goal-checkbox.done { background: var(--green); border-color: var(--green); }
.idp-goal-checkbox.done::after { content: '✓'; color: #fff; font-size: 11px; font-weight: 700; }
.idp-goal-text { flex: 1; font-size: 14px; line-height: 1.5; }
.idp-goal-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }

/* REVIEW COMPARISON */
.idp-review-comparison { display: flex; gap: 0; margin-bottom: 6px; align-items: flex-start; }
.idp-review-attr-col { width: 80px; flex-shrink: 0; padding-right: 8px; }
.idp-review-period-col { flex: 1; min-width: 0; padding: 0 6px; border-left: 1px solid var(--border); }
.idp-review-period-label { font-size: 11px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.idp-review-coach-lbl { font-size: 10px; color: var(--text3); margin-bottom: 8px; }
.idp-review-attr-name { font-size: 12px; font-weight: 500; color: var(--text2); padding-top: 4px; }
.idp-review-cat-section { margin-bottom: 1.25rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
.idp-review-cat-section:last-child { border-bottom: none; margin-bottom: 0; }
.idp-review-cat-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 10px; }

/* COLOUR HELPERS */
.fill-orange { background: linear-gradient(90deg,#e07000,#f09030); }
.fill-green  { background: linear-gradient(90deg,#1a5c28,#2A8C3F); }
.fill-gold   { background: linear-gradient(90deg,#8a6a00,#B8922A); }

/* IDP FOOTER */
.idp-footer { background: var(--bg); border-top: 1px solid var(--border); padding: 12px 2rem; font-size: 11px; color: var(--text3); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }

/* COLOUR LEGEND */
.colour-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text2); margin-bottom: 1.5rem; background: var(--surface); border-radius: var(--r-md); padding: 10px 14px; border: 1px solid var(--border); }
.legend-dot { width: 14px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: middle; }

@media print {
  .controls, .page-header, .bulk-section, .idp-actions, .colour-legend { display: none !important; }
  .idp-preview { margin: 0; padding: 0; max-width: 100%; }
  .idp-doc { box-shadow: none; border-radius: 0; page-break-after: always; margin-bottom: 0; border: none; }
  .idp-header-band, .idp-bar-fill, .idp-footer { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: white; }
}
@media (max-width: 600px) {
  .idp-body { padding: 1rem; }
  .idp-header-band { padding: 1.5rem 1rem 1.25rem; }
}
</style>
</head>
<body>

<div class="page-header">
  <img src="images/crest.png" alt="BRTFC">
  <div>
    <div class="page-header-title">IDP Generator</div>
    <div class="page-header-sub">Bognor Regis Town FC Academy</div>
  </div>
  <a href="index.html" class="back-btn">← Back to app</a>
</div>

<div class="controls">

  <!-- SINGLE IDP -->
  <div class="controls-card">
    <div class="controls-title">Generate individual IDP</div>
    <div class="form-row">
      <div class="form-group">
        <label>Age group</label>
        <select id="gen-group" onchange="loadGenPlayers()">
          <option value="">Select group...</option>
          <option>U14</option><option>U15</option><option>U16</option><option>U18</option>
        </select>
      </div>
      <div class="form-group">
        <label>Player</label>
        <select id="gen-player" onchange="generateIDP()">
          <option value="">Select player...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Term</label>
        <select id="gen-term" onchange="generateIDP()">
          <option value="1">Term 1 (Aug-Oct)</option>
          <option value="2">Term 2 (Nov-Jan)</option>
          <option value="3">Term 3 (Feb-Apr)</option>
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="generateIDP()">Preview IDP</button>
      <button class="btn-secondary" onclick="window.print()">Print / Save PDF</button>
      <button class="btn-amber" onclick="emailCurrentIDP()">✉ Email player</button>
    </div>
    <div id="gen-status" class="status-msg"></div>
  </div>

  <!-- BULK ACTIONS -->
  <div class="bulk-section">
    <div class="bulk-title">Bulk actions — whole group</div>
    <div class="form-row">
      <div class="form-group">
        <label>Age group</label>
        <select id="bulk-group" onchange="loadBulkPlayers()">
          <option value="">Select group...</option>
          <option>U14</option><option>U15</option><option>U16</option><option>U18</option>
        </select>
      </div>
      <div class="form-group">
        <label>Term</label>
        <select id="bulk-term">
          <option value="1">Term 1 (Aug-Oct)</option>
          <option value="2">Term 2 (Nov-Jan)</option>
          <option value="3">Term 3 (Feb-Apr)</option>
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" onclick="bulkPrintAll()">Print all IDPs</button>
      <button class="btn-amber" onclick="bulkEmailAll()">✉ Email all players</button>
    </div>
    <div id="bulk-status" class="status-msg"></div>
    <div id="bulk-player-list" class="bulk-player-list"></div>
  </div>

</div>

<div id="colour-legend-wrap" class="controls" style="display:none;">
  <div class="colour-legend">
    <span style="font-weight:600;color:var(--text2);">Rating guide:</span>
    <span><span class="legend-dot fill-orange"></span>Below 2.5: Focus needed</span>
    <span><span class="legend-dot fill-green"></span>2.5 to 3.5: Developing well</span>
    <span><span class="legend-dot fill-gold"></span>Above 3.5: Exceeding standard</span>
  </div>
</div>

<div class="idp-preview" id="idp-preview">
  <div style="text-align:center;padding:3rem;color:var(--text3);font-size:14px;">Select a player and term to generate their IDP.</div>
</div>

<script type="module">
import { db, ref, onValue } from './js/firebase.js';

let allPlayers  = {};
let allTraining = {};
let allMatches  = {};
let allMonthly  = {};
let allGoals    = {};
let halfTerms   = {};
let termDates   = { 1:{start:'',end:''}, 2:{start:'',end:''}, 3:{start:'',end:''} };

onValue(ref(db,'players'),   s => { allPlayers  = s.val()||{}; });
onValue(ref(db,'training'),  s => { allTraining = s.val()||{}; });
onValue(ref(db,'matches'),   s => { allMatches  = s.val()||{}; });
onValue(ref(db,'monthly'),   s => { allMonthly  = s.val()||{}; });
onValue(ref(db,'goals'),     s => { allGoals    = s.val()||{}; });
onValue(ref(db,'halfTerms'), s => { halfTerms   = s.val()||{}; });
onValue(ref(db,'termDates'), s => { if(s.val()) termDates = s.val(); });

// ── HELPERS ───────────────────────────────────────────────────────
function getTermRange(n) {
  const t = termDates[n];
  if (t?.start && t?.end) return { start: t.start, end: t.end };
  const y = new Date().getFullYear();
  const d = {
    1:{start:`${y-1}-08-01`,end:`${y-1}-10-31`},
    2:{start:`${y-1}-11-01`,end:`${y}-01-31`},
    3:{start:`${y}-02-01`,end:`${y}-04-30`}
  };
  return d[n]||d[1];
}

function inRange(dateStr, range) {
  if (!dateStr) return false;
  return dateStr >= range.start && dateStr <= range.end;
}

function avg(vals) {
  const clean = (vals||[]).map(v => parseFloat(v)).filter(v => !isNaN(v) && v > 0);
  if (!clean.length) return null;
  return (clean.reduce((a,b)=>a+b,0)/clean.length).toFixed(1);
}

function calcAge(dob) {
  const b = new Date(dob), now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  if (now.getMonth() < b.getMonth() || (now.getMonth()===b.getMonth() && now.getDate()<b.getDate())) age--;
  return age;
}

function barColour(v) {
  const n = parseFloat(v);
  if (n > 3.5)  return 'fill-gold';
  if (n >= 2.5) return 'fill-green';
  return 'fill-orange';
}

function idpBar(label, val) {
  if (!val) return '';
  const pct = Math.round((parseFloat(val)/5)*100);
  return `<div class="idp-bar-row">
    <div class="idp-bar-labels"><span>${label}</span><span>${val}/5</span></div>
    <div class="idp-bar-track"><div class="idp-bar-fill ${barColour(val)}" style="width:${pct}%;"></div></div>
  </div>`;
}

const DNA_LABELS = {
  technical:'On the Ball', tactical:'Game Understanding',
  behaviours:'Compete and Commit', physical:'Physical Execution',
  nonNegotiables:'BRTFC Non-Negotiables'
};

const TERM_LABELS = { '1':'Term 1 (Aug-Oct)', '2':'Term 2 (Nov-Jan)', '3':'Term 3 (Feb-Apr)' };

// ── BUILD IDP FOR A PLAYER ────────────────────────────────────────
function buildIDPData(pid, termNo) {
  const p = allPlayers[pid];
  if (!p) return null;
  const termRange = getTermRange(termNo);
  const termLabel = TERM_LABELS[termNo];

  const trainSessions = Object.values(allTraining).filter(t =>
    t.entries?.[pid] && inRange(t.date, termRange) &&
    (!t.entries[pid].attendance || t.entries[pid].attendance === 'present')
  );
  const matchSessions = Object.values(allMatches).filter(m =>
    m.entries?.[pid] && inRange(m.date, termRange) &&
    (!m.entries[pid].attendance || m.entries[pid].attendance === 'present')
  );
  const monthlyReports = Object.values(allMonthly).filter(mo => {
    if (mo.pid !== pid) return false;
    if (mo.month?.startsWith('ht_')) {
      const ht = halfTerms[mo.month];
      if (!ht?.start) return true;
      return inRange(ht.start, termRange);
    }
    if (mo.month) return inRange(mo.month+'-01', termRange);
    return true;
  });
  const goals = Object.entries(allGoals).filter(([id,g]) => g.pid === pid);

  const allSessions = [
    ...Object.values(allTraining).filter(t => t.entries?.[pid]),
    ...Object.values(allMatches).filter(m => m.entries?.[pid])
  ];
  const total = allSessions.length;
  const present = allSessions.filter(s => !s.entries[pid].attendance || s.entries[pid].attendance === 'present').length;
  const injured = allSessions.filter(s => s.entries[pid].attendance === 'injured').length;
  const absent  = allSessions.filter(s => s.entries[pid].attendance === 'absent').length;
  const attPct  = total ? Math.round((present/total)*100) : null;

  const trainAttAvg  = avg(trainSessions.map(t => t.entries[pid].attitude));
  const trainCommAvg = avg(trainSessions.map(t => t.entries[pid].communication));
  const trainPerfAvg = avg(trainSessions.map(t => t.entries[pid].performance));
  const matchMindAvg = avg(matchSessions.map(m => m.entries[pid].mindset));
  const matchPhysAvg = avg(matchSessions.map(m => m.entries[pid].physical));
  const matchImpAvg  = avg(matchSessions.map(m => m.entries[pid].impact));

  const moAvgs = {};
  ['technical','tactical','behaviours','physical','nonNegotiables'].forEach(cat => {
    moAvgs[cat] = avg(monthlyReports.map(r => r[cat]?.rating||0).filter(v=>v>0));
    moAvgs[`${cat}_comments`] = monthlyReports.map(r => {
      const comment = r[cat]?.comments;
      if (!comment) return null;
      const htLabel = r.month?.startsWith('ht_') && halfTerms[r.month]?.label ? halfTerms[r.month].label+': ' : '';
      return htLabel + comment;
    }).filter(Boolean).join(' | ');
  });

  const allVals = [trainAttAvg,trainCommAvg,trainPerfAvg,matchMindAvg,matchPhysAvg,matchImpAvg,
    moAvgs.technical,moAvgs.tactical,moAvgs.behaviours,moAvgs.physical]
    .map(v => parseFloat(v)).filter(v => !isNaN(v) && v > 0);
  const overallAvg = allVals.length ? (allVals.reduce((a,b)=>a+b,0)/allVals.length).toFixed(1) : null;

  // Multi-term progression
  const METRICS = [
    { label:'Attitude',      colour:'#2A8C3F', getData:(tr,mt) => tr.map(t=>t.entries[pid]?.attitude) },
    { label:'Communication', colour:'#185fa5', getData:(tr,mt) => tr.map(t=>t.entries[pid]?.communication) },
    { label:'Performance',   colour:'#B8922A', getData:(tr,mt) => tr.map(t=>t.entries[pid]?.performance) },
    { label:'Mindset',       colour:'#ef9f27', getData:(tr,mt) => mt.map(m=>m.entries[pid]?.mindset) },
    { label:'Physical',      colour:'#C0272D', getData:(tr,mt) => mt.map(m=>m.entries[pid]?.physical) },
    { label:'Impact',        colour:'#7b2d8b', getData:(tr,mt) => mt.map(m=>m.entries[pid]?.impact) }
  ];

  const termData = [1,2,3].map(tn => {
    const range = getTermRange(tn);
    const tr = Object.values(allTraining).filter(t =>
      t.entries?.[pid] && inRange(t.date, range) &&
      (!t.entries[pid].attendance || t.entries[pid].attendance === 'present')
    );
    const mt = Object.values(allMatches).filter(m =>
      m.entries?.[pid] && inRange(m.date, range) &&
      (!m.entries[pid].attendance || m.entries[pid].attendance === 'present')
    );
    return { tn, tr, mt, hasData: tr.length > 0 || mt.length > 0 };
  });

  return { p, termLabel, termNo, trainSessions, matchSessions, monthlyReports, goals,
    trainAttAvg, trainCommAvg, trainPerfAvg, matchMindAvg, matchPhysAvg, matchImpAvg,
    moAvgs, overallAvg, attPct, injured, absent, present, total,
    termData, METRICS };
}

// ── RENDER IDP HTML ───────────────────────────────────────────────
function renderIDPHTML(d) {
  const { p, termLabel, trainSessions, matchSessions, monthlyReports, goals,
    trainAttAvg, trainCommAvg, trainPerfAvg, matchMindAvg, matchPhysAvg, matchImpAvg,
    moAvgs, overallAvg, attPct, injured, absent, present, total,
    termData, METRICS } = d;

  const age = p.dob ? calcAge(p.dob) : 'N/A';
  const year = new Date().getFullYear();
  const generated = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

  // Progression SVG
  const W=540,H=170,PAD_L=50,PAD_R=16,PAD_T=14,PAD_B=28;
  const cW=W-PAD_L-PAD_R, cH=H-PAD_T-PAD_B;
  const xPos = [0,1,2].map(i => PAD_L + (i/2)*cW);
  const valY = v => PAD_T + cH - ((parseFloat(v)-1)/4)*cH;
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;" xmlns="http://www.w3.org/2000/svg">`;
  [1,2,3,4,5].forEach(v => {
    const y = valY(v);
    svg += `<line x1="${PAD_L}" y1="${y}" x2="${W-PAD_R}" y2="${y}" stroke="#e0e0dd" stroke-width="1"/>`;
    svg += `<text x="${PAD_L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#9b9a96">${v}</text>`;
  });
  [0,1,2].forEach(i => {
    svg += `<text x="${xPos[i]}" y="${H-4}" text-anchor="middle" font-size="11" font-weight="600" fill="#52514e">Term ${i+1}</text>`;
    if (!termData[i].hasData) svg += `<rect x="${xPos[i]-cW/6}" y="${PAD_T}" width="${cW/3}" height="${cH}" fill="#ebebea" opacity="0.6"/>`;
  });
  METRICS.forEach(metric => {
    const points = termData.map((td,i) => {
      const vals = metric.getData(td.tr,td.mt).map(v=>parseFloat(v)).filter(v=>!isNaN(v)&&v>0);
      const a = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
      return a ? {x:xPos[i],y:valY(a),v:a} : null;
    });
    const valid = points.filter(Boolean);
    if (!valid.length) return;
    if (valid.length > 1) {
      for (let i=0;i<valid.length-1;i++) {
        svg += `<line x1="${valid[i].x}" y1="${valid[i].y}" x2="${valid[i+1].x}" y2="${valid[i+1].y}" stroke="${metric.colour}" stroke-width="2.5" stroke-linecap="round"/>`;
      }
    }
    valid.forEach(pt => {
      svg += `<circle cx="${pt.x}" cy="${pt.y}" r="5" fill="${metric.colour}" stroke="white" stroke-width="1.5"/>`;
      svg += `<text x="${pt.x}" y="${pt.y-10}" text-anchor="middle" font-size="10" font-weight="700" fill="${metric.colour}">${pt.v.toFixed(1)}</text>`;
    });
  });
  svg += `</svg>`;
  const legend = METRICS.map(m =>
    `<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);">
      <span style="width:14px;height:3px;border-radius:99px;background:${m.colour};display:inline-block;"></span>${m.label}
    </span>`
  ).join('');

  // Review comparison sections
  const reviewHTML = monthlyReports.length ? `
    <div class="idp-section">
      <div class="idp-section-title">Half-term reviews</div>
      <div class="idp-review-comparison">
        <div class="idp-review-attr-col"></div>
        ${monthlyReports.map(r => {
          const htLabel = r.month?.startsWith('ht_') && halfTerms[r.month]?.label ? halfTerms[r.month].label : r.month||'Review';
          return `<div class="idp-review-period-col">
            <div class="idp-review-period-label">${htLabel}</div>
            <div class="idp-review-coach-lbl">Coach: ${r.coach||'Unknown'}</div>
          </div>`;
        }).join('')}
      </div>
      ${['technical','tactical','behaviours','physical'].map(cat => {
        const hasAny = monthlyReports.some(r => r[cat]?.rating || r[cat]?.comments);
        if (!hasAny) return '';
        return `<div class="idp-review-cat-section">
          <div class="idp-review-cat-title">${DNA_LABELS[cat]}</div>
          <div class="idp-review-comparison">
            <div class="idp-review-attr-col"><div class="idp-review-attr-name">Rating</div></div>
            ${monthlyReports.map(r => {
              const rating = r[cat]?.rating;
              const pct = rating ? Math.round((parseFloat(rating)/5)*100) : 0;
              return `<div class="idp-review-period-col">
                ${rating ? `<div style="display:flex;align-items:center;gap:6px;">
                  <div class="idp-bar-track" style="flex:1;height:8px;">
                    <div class="idp-bar-fill ${barColour(rating)}" style="width:${pct}%;"></div>
                  </div>
                  <span style="font-size:12px;font-weight:700;">${parseFloat(rating).toFixed(1)}</span>
                </div>` : '<span style="font-size:12px;color:var(--text3);">N/A</span>'}
              </div>`;
            }).join('')}
          </div>
          ${monthlyReports.some(r=>r[cat]?.comments) ? `<div style="margin-top:8px;">
            ${monthlyReports.map(r => {
              if (!r[cat]?.comments) return '';
              const htLabel = r.month?.startsWith('ht_') && halfTerms[r.month]?.label ? halfTerms[r.month].label : r.month||'Review';
              return `<div class="idp-comments-block" style="margin-bottom:6px;">
                <span style="font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:0.06em;">${htLabel}</span><br>${r[cat].comments}
              </div>`;
            }).join('')}
          </div>` : ''}
        </div>`;
      }).join('')}
      ${monthlyReports.some(r=>r.nonNegotiables?.rating||r.nonNegotiables?.comments) ? `
      <div class="idp-review-cat-section" style="background:var(--green-light);border-radius:var(--r-sm);padding:12px;">
        <div class="idp-review-cat-title" style="color:var(--green-dark);">BRTFC Non-Negotiables</div>
        <div style="font-size:12px;color:var(--green-dark);margin-bottom:8px;opacity:0.7;">Scan early. Communicate early. React immediately.</div>
        <div class="idp-review-comparison">
          <div class="idp-review-attr-col"><div class="idp-review-attr-name">Rating</div></div>
          ${monthlyReports.map(r => {
            const rating = r.nonNegotiables?.rating;
            const pct = rating ? Math.round((parseFloat(rating)/5)*100) : 0;
            return `<div class="idp-review-period-col">
              ${rating ? `<div style="display:flex;align-items:center;gap:6px;">
                <div class="idp-bar-track" style="flex:1;height:8px;">
                  <div class="idp-bar-fill ${barColour(rating)}" style="width:${pct}%;"></div>
                </div>
                <span style="font-size:12px;font-weight:700;">${parseFloat(rating).toFixed(1)}</span>
              </div>` : '<span style="font-size:12px;color:var(--text3);">N/A</span>'}
            </div>`;
          }).join('')}
        </div>
        ${monthlyReports.some(r=>r.nonNegotiables?.comments) ? `<div style="margin-top:8px;">
          ${monthlyReports.map(r => {
            if (!r.nonNegotiables?.comments) return '';
            const htLabel = r.month?.startsWith('ht_') && halfTerms[r.month]?.label ? halfTerms[r.month].label : 'Review';
            return `<div class="idp-comments-block" style="margin-bottom:6px;">
              <span style="font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:0.06em;">${htLabel}</span><br>${r.nonNegotiables.comments}
            </div>`;
          }).join('')}
        </div>` : ''}
      </div>` : ''}
    </div>` : '';

  return `<div class="idp-doc">
    <div class="idp-header-band">
      <div class="idp-crest-row">
        <img src="images/crest.png" alt="BRTFC" class="idp-crest">
        <div>
          <div class="idp-club-name">Bognor Regis Town Football Club</div>
          <div class="idp-doc-title">Individual Development Plan</div>
          <div class="idp-player-name">${p.fname} ${p.lname}</div>
        </div>
      </div>
      <div class="idp-meta-row">
        <div class="idp-meta-item"><strong>${termLabel}</strong><span>Term</span></div>
        <div class="idp-meta-item"><strong>${p.group}</strong><span>Age group</span></div>
        <div class="idp-meta-item"><strong>${p.pos}</strong><span>Position</span></div>
        <div class="idp-meta-item"><strong>${age}</strong><span>Age</span></div>
        <div class="idp-meta-item"><strong>${overallAvg ? overallAvg+'/5' : 'N/A'}</strong><span>Overall</span></div>
      </div>
    </div>

    <div class="idp-body">

      <div class="idp-section">
        <div class="idp-section-title">Season summary</div>
        <div class="idp-metric-grid">
          <div class="idp-metric"><div class="idp-metric-val">${trainSessions.length}</div><div class="idp-metric-lbl">Training</div></div>
          <div class="idp-metric"><div class="idp-metric-val">${matchSessions.length}</div><div class="idp-metric-lbl">Matches</div></div>
          <div class="idp-metric"><div class="idp-metric-val" style="color:${attPct && attPct < 85 ? 'var(--red)' : 'var(--green-dark)'}">${attPct ? attPct+'%' : 'N/A'}</div><div class="idp-metric-lbl">Attendance</div></div>
          <div class="idp-metric"><div class="idp-metric-val">${overallAvg || 'N/A'}</div><div class="idp-metric-lbl">Overall avg</div></div>
        </div>
        ${attPct && attPct < 85 ? `<div class="idp-alert"><strong>Attendance flag:</strong> ${attPct}% is below the 85% threshold. ${injured ? injured+' session(s) missed through injury. ' : ''}${absent ? absent+' session(s) absent without reason.' : ''}</div>` : ''}
      </div>

      <div class="idp-section">
        <div class="idp-section-title">Season progression</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:10px;">Scores across all three terms. Grey areas = no data yet.</div>
        ${svg}
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;">${legend}</div>
      </div>

      ${trainSessions.length ? `<div class="idp-section">
        <div class="idp-section-title">Training performance</div>
        ${idpBar('Attitude', trainAttAvg)}
        ${idpBar('Communication', trainCommAvg)}
        ${idpBar('Performance', trainPerfAvg)}
      </div>` : ''}

      ${matchSessions.length ? `<div class="idp-section">
        <div class="idp-section-title">Match performance</div>
        ${idpBar('Mindset', matchMindAvg)}
        ${idpBar('Physical', matchPhysAvg)}
        ${idpBar('Impact', matchImpAvg)}
      </div>` : ''}

      ${reviewHTML}

      <div class="idp-section">
        <div class="idp-section-title">Development goals</div>
        ${goals.length ? goals.slice(0,2).map(([id,g]) => `
          <div class="idp-goal-item">
            <div class="idp-goal-checkbox ${g.achieved?'done':''}"></div>
            <div class="idp-goal-text">
              ${g.text}
              <div class="idp-goal-sub">Set by your coaching team &bull; ${g.achieved ? '✓ Achieved' : 'In progress'}</div>
            </div>
          </div>`).join('') : '<div style="font-size:14px;color:var(--text3);">No goals set for this term.</div>'}
      </div>

    </div>

    <div class="idp-footer">
      <span>Bognor Regis Town FC Academy &bull; ${p.fname} ${p.lname} &bull; ${termLabel} ${year}</span>
      <span>Generated ${generated} &bull; Confidential</span>
    </div>
  </div>`;
}

// ── GENERATE SINGLE IDP ───────────────────────────────────────────
window.loadGenPlayers = function() {
  const group = document.getElementById('gen-group').value;
  const sel = document.getElementById('gen-player');
  sel.innerHTML = '<option value="">Select player...</option>';
  if (!group) return;
  Object.entries(allPlayers)
    .filter(([id,p]) => p.group === group)
    .sort((a,b) => a[1].lname.localeCompare(b[1].lname))
    .forEach(([id,p]) => sel.innerHTML += `<option value="${id}">${p.fname} ${p.lname}</option>`);
};

window.generateIDP = function() {
  const pid    = document.getElementById('gen-player').value;
  const termNo = parseInt(document.getElementById('gen-term').value);
  const preview = document.getElementById('idp-preview');
  if (!pid) { preview.innerHTML = '<div style="text-align:center;padding:3rem;color:var(--text3);font-size:14px;">Select a player and term.</div>'; return; }
  const d = buildIDPData(pid, termNo);
  if (!d) return;
  preview.innerHTML = renderIDPHTML(d);
  document.getElementById('colour-legend-wrap').style.display = 'block';
  document.getElementById('gen-status').textContent = 'IDP generated. Use Print / Save PDF to download.';
};

window.emailCurrentIDP = function() {
  const pid    = document.getElementById('gen-player').value;
  const termNo = parseInt(document.getElementById('gen-term').value);
  if (!pid) { alert('Generate an IDP first.'); return; }
  emailPlayerIDP(pid, termNo);
};

// ── EMAIL FUNCTION ────────────────────────────────────────────────
function emailPlayerIDP(pid, termNo) {
  const d = buildIDPData(pid, termNo);
  if (!d) return;
  const { p, termLabel, trainSessions, matchSessions, overallAvg } = d;

  const to = [p.email, p.pemail].filter(Boolean).join(',');
  if (!to) { alert(`No email address on file for ${p.fname} ${p.lname}. Add one in Admin > Players.`); return; }

  const subject = encodeURIComponent(`BRTFC Academy IDP — ${p.fname} ${p.lname} — ${termLabel}`);
  const body = encodeURIComponent(
`Dear ${p.fname} and family,

Please find below a summary of ${p.fname}'s Individual Development Plan for ${termLabel} at Bognor Regis Town FC Academy.

Player: ${p.fname} ${p.lname}
Age group: ${p.group}
Position: ${p.pos}
Term: ${termLabel}
Overall rating: ${overallAvg || 'N/A'}/5
Training sessions: ${trainSessions.length}
Matches: ${matchSessions.length}

Your full IDP with detailed scores and coach feedback is available through the Academy portal. Please speak to your coach if you have any questions.

Regards,
BRTFC Academy Coaching Team`
  );

  window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
}

// ── BULK ACTIONS ──────────────────────────────────────────────────
window.loadBulkPlayers = function() {
  const group = document.getElementById('bulk-group').value;
  const list  = document.getElementById('bulk-player-list');
  list.innerHTML = '';
  if (!group) return;
  const players = Object.entries(allPlayers)
    .filter(([id,p]) => p.group === group)
    .sort((a,b) => a[1].lname.localeCompare(b[1].lname));
  if (!players.length) { list.innerHTML = '<div style="font-size:13px;color:var(--text3);">No players in this group.</div>'; return; }
  list.innerHTML = players.map(([id,p]) => `
    <div class="bulk-player-row">
      <div class="bulk-player-name">${p.fname} ${p.lname}</div>
      <div class="bulk-player-meta">${p.pos}</div>
      <div class="bulk-player-email">${[p.email,p.pemail].filter(Boolean).join(', ') || 'No email'}</div>
      <div class="bulk-btn-row">
        <button class="btn-secondary" style="font-size:12px;padding:6px 12px;" onclick="printOneFromBulk('${id}')">Print</button>
        <button class="btn-amber" style="font-size:12px;padding:6px 12px;" onclick="emailOneFromBulk('${id}')">✉ Email</button>
      </div>
    </div>`
  ).join('');
  document.getElementById('bulk-status').textContent = `${players.length} players loaded.`;
};

window.printOneFromBulk = function(pid) {
  const termNo = parseInt(document.getElementById('bulk-term').value);
  const d = buildIDPData(pid, termNo);
  if (!d) return;
  document.getElementById('idp-preview').innerHTML = renderIDPHTML(d);
  document.getElementById('colour-legend-wrap').style.display = 'block';
  setTimeout(() => window.print(), 400);
};

window.emailOneFromBulk = function(pid) {
  const termNo = parseInt(document.getElementById('bulk-term').value);
  emailPlayerIDP(pid, termNo);
};

window.bulkPrintAll = function() {
  const group  = document.getElementById('bulk-group').value;
  const termNo = parseInt(document.getElementById('bulk-term').value);
  if (!group) { alert('Select an age group first.'); return; }
  const players = Object.entries(allPlayers)
    .filter(([id,p]) => p.group === group)
    .sort((a,b) => a[1].lname.localeCompare(b[1].lname));
  if (!players.length) { alert('No players in this group.'); return; }
  const html = players.map(([pid]) => {
    const d = buildIDPData(pid, termNo);
    return d ? renderIDPHTML(d) : '';
  }).join('');
  document.getElementById('idp-preview').innerHTML = html;
  document.getElementById('colour-legend-wrap').style.display = 'none';
  setTimeout(() => window.print(), 600);
};

window.bulkEmailAll = function() {
  const group  = document.getElementById('bulk-group').value;
  const termNo = parseInt(document.getElementById('bulk-term').value);
  if (!group) { alert('Select an age group first.'); return; }
  const players = Object.entries(allPlayers)
    .filter(([id,p]) => p.group === group && (p.email || p.pemail))
    .sort((a,b) => a[1].lname.localeCompare(b[1].lname));
  if (!players.length) { alert('No players with email addresses in this group.'); return; }

  let i = 0;
  const sendNext = () => {
    if (i >= players.length) {
      document.getElementById('bulk-status').textContent = `All ${players.length} emails opened.`;
      return;
    }
    document.getElementById('bulk-status').textContent = `Opening email ${i+1} of ${players.length}...`;
    emailPlayerIDP(players[i][0], termNo);
    i++;
    setTimeout(sendNext, 1500);
  };
  sendNext();
};
</script>
</body>
</html>
